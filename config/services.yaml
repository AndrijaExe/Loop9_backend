# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Model\Chat\AiChatGateway:
        alias: App\Adapter\AI\OpenAiCompatibleAiChatGateway
