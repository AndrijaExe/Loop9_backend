    App\Model\Chat\ContentSafetyGateway:
        alias: App\Adapter\AI\OpenAiContentSafetyGateway
        public: false

    App\Adapter\AI\OpenAiCompatibleHttpClientInterface:
        alias: App\Adapter\AI\OpenAiCompatibleHttpClient
        public: false
