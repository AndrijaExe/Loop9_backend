# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    env(GAME_ABUSE_WATCH_CHATS): '40'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            # Built by the factories below, which decide whether Redis is available.
            - '../src/Adapter/Telemetry/RedisEventCounters.php'
            - '../src/Adapter/Telemetry/RedisPlayerPresence.php'
            - '../src/Adapter/Telemetry/RedisChatVolume.php'

    App\Model\Telemetry\EventCounters:
        factory: ['App\Adapter\Telemetry\EventCountersFactory', 'create']
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
            $logger: '@monolog.logger.telemetry'

    App\Model\Telemetry\PlayerPresence:
        factory: ['App\Adapter\Telemetry\PlayerPresenceFactory', 'create']
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
            $logger: '@monolog.logger.telemetry'

    App\Model\Telemetry\ChatVolume:
        factory: ['App\Adapter\Telemetry\ChatVolumeFactory', 'create']
        arguments:
            $redisUrl: '%env(REDIS_URL)%'
            $logger: '@monolog.logger.telemetry'
            $watchAfter: '%env(int:GAME_ABUSE_WATCH_CHATS)%'

    App\Model\Chat\AiChatGateway:
        alias: App\Adapter\AI\OpenAiCompatibleAiChatGateway
        public: false

    App\Model\Chat\ContentSafetyGateway:
        alias: App\Adapter\AI\OpenAiContentSafetyGateway
        public: false

    App\Model\Chat\CommitmentOptions:
        arguments:
            $masterEnabled: '%env(bool:AI_COMMITMENT_ENABLED)%'
            $locationMisdirectionEnabled: '%env(bool:AI_COMMITMENT_LOCATION_ENABLED)%'
            $wrongLiftEnabled: '%env(bool:AI_COMMITMENT_WRONG_LIFT_ENABLED)%'

    App\Adapter\AI\OpenAiCompatibleHttpClientInterface:
        alias: App\Adapter\AI\OpenAiCompatibleHttpClient
        public: false

    # These services emit deliberately sanitized operational telemetry. Keep
    # them on a dedicated channel so healthy INFO events bypass the production
    # error buffer without exposing Symfony's secret-bearing http_client logs.
    App\Adapter\Http\RunTelemetryController:
        arguments:
            $logger: '@monolog.logger.telemetry'

    App\Adapter\Http\SteamAuthController:
        arguments:
            $logger: '@monolog.logger.telemetry'

    App\Adapter\Http\ChatController:
        arguments:
            $logger: '@monolog.logger.telemetry'

    App\Adapter\AI\OpenAiCompatibleAiChatGateway:
        arguments:
            $logger: '@monolog.logger.telemetry'

    App\Adapter\AI\OpenAiContentSafetyGateway:
        arguments:
            $logger: '@monolog.logger.telemetry'
