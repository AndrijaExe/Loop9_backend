framework:
    cache:
        # Dedicated pool for rate limiter counters. Filesystem by default
        # (local dev); prod overrides to Redis below so quotas survive
        # restarts and work across multiple instances.
        pools:
            rate_limiter.storage:
                adapter: cache.adapter.filesystem

when@test:
    framework:
        cache:
            pools:
                rate_limiter.storage:
                    adapter: cache.adapter.array

when@prod:
    framework:
        cache:
            pools:
                rate_limiter.storage:
                    adapter: cache.adapter.redis
                    provider: '%env(REDIS_URL)%'
