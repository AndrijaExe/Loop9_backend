# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind Render (or any reverse proxy) the real client IP arrives via
    # X-Forwarded-For; without this, all players share the proxy IP and
    # rate limits break. REMOTE_ADDR means "trust the immediate peer".
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    # Native game clients do not need Symfony sessions.
    session: false

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
