name: Deploy Backend To Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        run: php bin/phpunit

      - name: Lint service container
        run: php bin/console lint:container

      - name: Lint YAML config
        run: php bin/console lint:yaml config

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Missing required GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          echo "Triggering Render deploy..."
          curl --fail --show-error --silent -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deploy hook triggered."
