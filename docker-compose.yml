services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loop9-backend
    ports:
      - "8080:80"
    environment:
      # Compose-specific names prevent Symfony's checked-in .env defaults
      # (APP_ENV=dev, localhost Redis) from overriding container-safe values.
      APP_ENV: ${DOCKER_APP_ENV:-prod}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-0}
      GAME_API_TOKEN: ${GAME_API_TOKEN:-}
      GAME_DAILY_PLAYER_QUOTA: ${GAME_DAILY_PLAYER_QUOTA:-120}
      GAME_MONTHLY_PLAYER_QUOTA: ${GAME_MONTHLY_PLAYER_QUOTA:-2000}
      GAME_DAILY_IP_QUOTA: ${GAME_DAILY_IP_QUOTA:-300}
      GAME_GLOBAL_DAILY_QUOTA: ${GAME_GLOBAL_DAILY_QUOTA:-5000}
      # Direct Compose traffic must not trust client-supplied X-Forwarded-For.
      TRUSTED_PROXIES: ${DOCKER_TRUSTED_PROXIES:-127.0.0.1}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_APP_ID: ${STEAM_APP_ID:-}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:-}
      SESSION_TOKEN_TTL: ${SESSION_TOKEN_TTL:-43200}
      # Production-like compose defaults to Steam-only auth.
      AUTH_ALLOW_GAME_TOKEN: ${AUTH_ALLOW_GAME_TOKEN:-false}
      AI_CHAT_COMPLETIONS_URL: ${AI_CHAT_COMPLETIONS_URL:-https://api.openai.com/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-}
      AI_TLS_VERIFY: ${AI_TLS_VERIFY:-true}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      AI_FALLBACK_CHAT_COMPLETIONS_URL: ${AI_FALLBACK_CHAT_COMPLETIONS_URL:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_FALLBACK_TLS_VERIFY: ${AI_FALLBACK_TLS_VERIFY:-true}
      AI_FALLBACK2_ENABLED: ${AI_FALLBACK2_ENABLED:-false}
      AI_FALLBACK2_CHAT_COMPLETIONS_URL: ${AI_FALLBACK2_CHAT_COMPLETIONS_URL:-}
      AI_FALLBACK2_API_KEY: ${AI_FALLBACK2_API_KEY:-}
      AI_FALLBACK2_MODEL: ${AI_FALLBACK2_MODEL:-}
      AI_FALLBACK2_TLS_VERIFY: ${AI_FALLBACK2_TLS_VERIFY:-true}
      AI_MODERATION_URL: ${AI_MODERATION_URL:-https://api.openai.com/v1/moderations}
      AI_MODERATION_API_KEY: ${AI_MODERATION_API_KEY:-}
      AI_MODERATION_MODEL: ${AI_MODERATION_MODEL:-omni-moderation-latest}
      AI_MODERATION_TIMEOUT_SECONDS: ${AI_MODERATION_TIMEOUT_SECONDS:-3}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: loop9-redis
    # noeviction: rate-limit keys must not be silently dropped under memory pressure.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
